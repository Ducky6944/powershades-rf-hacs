[project]
name = "powershades"
version = "0.1.0"
description = "PowerShades Home Assistant integration"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=61"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["**/.git/**", "**/node_modules/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports / undefined names)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "RUF", # Ruff-specific
]
ignore = [
    "RUF012",  # mutable class attrs (dataclass defaults) are fine here
]

[tool.ruff.lint.isort]
known-first-party = ["powershades"]
combine-as-imports = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"custom_components/powershades/__init__.py" = ["F401"]
